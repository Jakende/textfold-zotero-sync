name: Check Zotero add-on
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: node --test core.test.cjs platform.test.cjs
      - run: python build.py
